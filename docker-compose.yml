# OTProbe POC — one command, no external infrastructure.
# SIMULATED ENVIRONMENT - NO REAL DEVICES ARE BEING SCANNED
name: otprobe

x-sim-env: &sim-env
  SPEED_FACTOR: ${SPEED_FACTOR:-1.0}
  SEED: ${SEED:-42}
  HEARTBEAT_INTERVAL_SEC: ${HEARTBEAT_INTERVAL_SEC:-10}
  SIM_SERVICE_TOKEN: ${SIM_SERVICE_TOKEN:-change-me-sim-token}

services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      <<: *sim-env
      ASSESSMENT_INTERVAL_SEC: ${ASSESSMENT_INTERVAL_SEC:-300}
      ASSESSMENT_TIMEOUT_SEC: ${ASSESSMENT_TIMEOUT_SEC:-120}
      ENROLLMENT_TIMEOUT_SEC: ${ENROLLMENT_TIMEOUT_SEC:-120}
      DATABASE_URL: sqlite:////data/otprobe.db
      ADAPTER_MODE: simulated
      JWT_SECRET: ${JWT_SECRET:-change-me-demo-jwt-secret-at-least-32-bytes}
      VAULT_KEY: ${VAULT_KEY:-}
      RULES_DIR: /app/rules
      AGENT_SERVER_URL: http://api:8000
    volumes:
      - otprobe-data:/data
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent-runtime:
    # Simulated Probe Agents. Separate process; outbound HTTP to the API only (enroll, heartbeat, task polling).
    build: { context: ., dockerfile: agent/Dockerfile }
    environment:
      <<: *sim-env
      OTPROBE_API_URL: http://api:8000
      RUNTIME_POLL_SEC: "2"
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

  telemetry-sim:
    # Simulated MQTT publishers (sensors, PLC status). Separate process; publishes via the in-process broker.
    build: { context: ., dockerfile: telemetry/Dockerfile }
    environment:
      <<: *sim-env
      OTPROBE_API_URL: http://api:8000
      TELEMETRY_INTERVAL_SEC: ${TELEMETRY_INTERVAL_SEC:-5}
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["8080:80"]
    depends_on: { api: { condition: service_healthy } }

volumes:
  otprobe-data:
