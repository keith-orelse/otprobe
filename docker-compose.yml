# OTProbe on a Linux host, live network only (docs/LIVE_ARCHITECTURE.md). Nothing is scanned until an admin adds a
# scan scope (Settings -> Scan scope). The simulated POC is on the `simulated` branch.
#   docker compose up -d
name: otprobe

# The API uses the host's network stack (ARP needs layer 2; scans must leave from the host's own address), so the
# web container reaches it through the host gateway under the name "api".
x-api-host: &api-host
  extra_hosts: ["api:host-gateway"]

services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]          # ICMP echo and ARP only
    environment:
      HEARTBEAT_INTERVAL_SEC: ${HEARTBEAT_INTERVAL_SEC:-10}
      SAFE_MODE: ${SAFE_MODE:-true}
      SCAN_MAX_PPS: ${SCAN_MAX_PPS:-50}
      ASSESSMENT_INTERVAL_SEC: ${ASSESSMENT_INTERVAL_SEC:-300}
      ASSESSMENT_TIMEOUT_SEC: ${ASSESSMENT_TIMEOUT_SEC:-120}
      ENROLLMENT_TIMEOUT_SEC: ${ENROLLMENT_TIMEOUT_SEC:-120}
      DATABASE_URL: sqlite:////data/otprobe.db
      VAULT_KEY: ${VAULT_KEY:-}
      VAULT_KEY_FILE: /keys/otprobe-vault.key     # separate volume: never in backups of the data volume
      JWT_SECRET: ${JWT_SECRET:-change-me-demo-jwt-secret-at-least-32-bytes}   # live mode replaces the demo value
      OTPROBE_ADMIN_PASSWORD: ${OTPROBE_ADMIN_PASSWORD:-}
      OTPROBE_OPERATOR_PASSWORD: ${OTPROBE_OPERATOR_PASSWORD:-}
      OTPROBE_APPROVER_PASSWORD: ${OTPROBE_APPROVER_PASSWORD:-}
      RULES_DIR: /app/rules
      AGENT_SERVER_URL: ${AGENT_SERVER_URL:-http://api:8000}
      # Bundled MQTT broker (docs/MQTT_BROKER.md): devices connect to this host on 8883 (TLS). Its files live in
      # /data/mqtt. TLS needs OTPROBE_TLS_CA_FILE with otprobe-server.pem/.key next to it (scripts/make_lab_tls.py).
      MQTT_BROKER: ${MQTT_BROKER:-bundled}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_PLAIN_PORT: ${MQTT_PLAIN_PORT:-0}
      OTPROBE_TLS_CA_FILE: ${OTPROBE_TLS_CA_FILE:-}
    volumes:
      - otprobe-data:/data
      - otprobe-keys:/keys
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    <<: *api-host
    ports: ["8080:80"]
    depends_on: { api: { condition: service_healthy } }

volumes:
  otprobe-data:
  otprobe-keys:
