policy:
  id: ot-telemetry-thresholds
  name: OT Telemetry Thresholds
  version: 1.0.0
  kind: telemetry
  description: Threshold and staleness checks evaluated on every MQTT message (and by a staleness timer).

rules:
  - id: TEL-TEMP-001
    title: Line 1 temperature above warning threshold
    severity: MEDIUM
    sources: [TELEMETRY]
    topic: factory/line1/sensor01/temperature
    evidence: temperature
    condition: "<= 80"
    expected: "<= 80 C"
    on_fail: { status: WARNING, severity: MEDIUM }
    on_missing: { status: UNKNOWN }

  - id: TEL-TEMP-002
    title: Line 1 temperature above critical threshold
    severity: CRITICAL
    sources: [TELEMETRY]
    topic: factory/line1/sensor01/temperature
    evidence: temperature
    condition: "<= 95"
    expected: "<= 95 C"
    on_fail: { status: FAIL, severity: CRITICAL }
    on_missing: { status: UNKNOWN }

  - id: TEL-PRES-001
    title: Line 1 pressure above threshold
    severity: HIGH
    sources: [TELEMETRY]
    topic: factory/line1/sensor02/pressure
    evidence: pressure
    condition: "<= 6.0"
    expected: "<= 6.0 bar"
    on_fail: { status: FAIL, severity: HIGH }
    on_missing: { status: UNKNOWN }

  - id: TEL-PLC-001
    title: PLC status telemetry is current
    severity: HIGH
    sources: [TELEMETRY]
    topic: factory/line1/plc01/status
    evidence: mode
    condition: "== 'RUN'"
    stale_after_sec: 30
    expected: status message at least every 30 s with mode RUN
    on_fail: { status: FAIL, severity: HIGH }
    on_missing: { status: UNKNOWN }
