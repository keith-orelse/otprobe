# Agent eligibility policy. First matching entry wins. Evaluated after classification.
eligibility:
  - when: { classification.type: "== 'PLC'" }
    result: NOT_ELIGIBLE
    reason: Traditional PLCs are handled agentless/read-only in this POC.
  - when: { classification.type: "in ['Sensor', 'Industrial Switch', 'BACnet Controller', 'Modbus Device']" }
    result: NOT_ELIGIBLE
    reason: Embedded or network device; agentless monitoring only.
  - when: { classification.type: "== 'Windows Host'" }
    result: NOT_ELIGIBLE
    reason: Looks like Windows (ports 135/445/3389), but WinRM did not answer. Set up WinRM over HTTPS (port 5986) and run the agentless probe again.
  - when: { os.family: "== 'macos'" }
    result: NOT_SUPPORTED
    reason: macOS agent is not part of the first agent release; agentless only (SSH).
  - when: { os.family: "in ['windows', 'linux']", asset.criticality: "== 'CRITICAL'" }
    result: REVIEW_REQUIRED
    reason: Critical asset; deployment requires approver review and a maintenance window.
  - when: { os.family: "== 'windows'", services.winrm.available: "== true" }
    result: ELIGIBLE
    reason: Windows host with WinRM available.
  - when: { os.family: "== 'linux'", services.ssh.available: "== true" }
    result: ELIGIBLE
    reason: Linux host with SSH available.
  - when: { os.family: "== 'windows'" }
    result: NOT_ELIGIBLE
    reason: WinRM not available; agent cannot be deployed remotely.
  - when: { os.family: "== 'linux'" }
    result: NOT_ELIGIBLE
    reason: SSH not available; agent cannot be deployed remotely.
  - when: {}
    result: UNKNOWN
    reason: Run an agentless probe to determine eligibility.
