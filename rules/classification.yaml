# Classification signals (data, not code). confidence = matched weight / total weight for the type.
# Conditions use the same grammar as compliance rules (docs/RULES.md). A signal whose field is missing does not match.
# A type is only assigned when its confidence is >= min_confidence.
min_confidence: 40
types:
  - type: Windows Engineering Workstation
    default_criticality: HIGH
    level_hint: 2
    signals:
      - { name: Windows OS, field: os.name, condition: "contains 'Windows' and not contains 'Server'", weight: 30 }
      - { name: WinRM available, field: services.winrm.available, condition: "== true", weight: 15 }
      - { name: Engineering software detected, field: "software.installed[].name", condition: "matches '(TIA Portal|Studio 5000|STEP 7|Automation Studio)'", weight: 35 }
      - { name: Hostname pattern, field: identity.hostname, condition: "matches '^eng-?ws'", weight: 15 }
      - { name: OT protocol client, field: "network.connections[].remote_port", condition: "intersects [102, 44818, 502]", weight: 5 }
      - { name: Dual-homed (L2 + L1 interfaces), field: "network.interfaces", condition: "count >= 2", weight: 10 }

  - type: SCADA Server
    default_criticality: CRITICAL
    level_hint: 2
    signals:
      - { name: Windows Server OS, field: os.name, condition: "contains 'Server'", weight: 30 }
      - { name: SCADA software detected, field: "software.installed[].name", condition: "matches '(SCADA|WinCC|FactoryTalk|Ignition)'", weight: 40 }
      - { name: Hostname pattern, field: identity.hostname, condition: "matches '^scada'", weight: 15 }
      - { name: OPC UA listening, field: "network.listening[]", condition: "contains 4840", weight: 15 }
      - { name: OPC UA server identified, field: ot.protocols, condition: "contains 'opcua'", weight: 15 }

  # A Windows PC or server with no engineering / SCADA software is an ordinary IT host on the plant network. Found
  # on a real laptop, which the engineering-workstation type claimed at 41 % from "Windows + WinRM" alone.
  - type: Windows Workstation
    default_criticality: MEDIUM
    level_hint: 3
    signals:
      - { name: Windows desktop OS, field: os.name, condition: "contains 'Windows' and not contains 'Server'", weight: 30 }
      - { name: No engineering or SCADA software found, field: "software.installed[].name", condition: "not matches '(TIA Portal|Studio 5000|STEP 7|Automation Studio|SCADA|WinCC|FactoryTalk|Ignition)'", weight: 70 }

  - type: Windows Server
    default_criticality: HIGH
    level_hint: 3
    signals:
      - { name: Windows Server OS, field: os.name, condition: "contains 'Server'", weight: 30 }
      - { name: No SCADA software found, field: "software.installed[].name", condition: "not matches '(SCADA|WinCC|FactoryTalk|Ignition)'", weight: 70 }

  # Windows recognised by its ports alone, when WinRM did not answer so the OS is not known yet. "OS not identified"
  # keeps it below the Windows Workstation / Server types once WinRM reports the OS (70 % against 100 %).
  - type: Windows Host
    default_criticality: MEDIUM
    level_hint: 3
    signals:
      - { name: Windows file sharing / RPC ports open, field: network.open_ports, condition: "intersects [135, 445]", weight: 50 }
      - { name: Remote Desktop port open, field: network.open_ports, condition: "contains 3389", weight: 20 }
      - { name: OS not identified yet (no WinRM), field: os.name, condition: "is empty", weight: 30 }

  - type: Historian (Linux Server)
    default_criticality: HIGH
    level_hint: 2
    signals:
      - { name: Linux OS, field: os.name, condition: "matches '(Ubuntu|Linux|Debian|Red Hat)'", weight: 40 }
      - { name: Hostname pattern, field: identity.hostname, condition: "matches '^hist'", weight: 30 }
      - { name: SSH identity available, field: services.ssh.available, condition: "== true", weight: 30 }

  - type: PLC
    default_criticality: CRITICAL
    level_hint: 1
    signals:
      - { name: PLC operating mode reported, field: plc.mode, condition: "in ['RUN', 'STOP', 'PROGRAM']", weight: 50 }
      - { name: Controller model, field: hardware.model, condition: "matches '(S7-|ControlLogix|CompactLogix|PLC)'", weight: 30 }
      - { name: Firmware reported, field: firmware.version, condition: "is not empty", weight: 20 }
      - { name: Answers as a controller over S7 or EtherNet/IP, field: ot.protocols, condition: "intersects ['s7', 'enip']", weight: 40 }
      - { name: CIP device type is PLC, field: ot.device_type, condition: "== 'Programmable Logic Controller'", weight: 30 }
      - { name: Siemens CPU order code, field: plc.product_code, condition: "matches '^6ES7'", weight: 30 }

  - type: Industrial Switch
    default_criticality: HIGH
    level_hint: 2
    signals:
      - { name: Interface table, field: network.active_ports, condition: "> 0", weight: 50 }
      - { name: Switch sysDescr, field: snmp.sys_descr, condition: "matches '(?i)switch|IMS'", weight: 50 }

  - type: Sensor
    default_criticality: MEDIUM
    level_hint: 0
    signals:
      - { name: Publishes process telemetry, field: telemetry.kind, condition: "in ['temperature', 'pressure', 'flow', 'level']", weight: 70 }
      - { name: ICMP disabled (typical field device), field: reachability.icmp, condition: "== 'BLOCKED'", weight: 30 }

  - type: BACnet Controller
    default_criticality: MEDIUM
    level_hint: 1
    signals:
      - { name: Answers BACnet ReadProperty, field: ot.protocols, condition: "contains 'bacnet'", weight: 70 }
      - { name: Firmware reported, field: firmware.version, condition: "is not empty", weight: 30 }

  - type: Modbus Device
    default_criticality: HIGH
    level_hint: 1
    signals:
      - { name: Answers Modbus Read Device Identification, field: ot.protocols, condition: "contains 'modbus'", weight: 40 }
      - { name: Vendor reported, field: hardware.vendor, condition: "is not empty", weight: 20 }
      # A controller that also serves Modbus must stay a PLC: this signal only matches Modbus-only devices, and
      # without it the type stays below min_confidence (60 of 200 = 30 %).
      # Only for devices that speak Modbus: on its own, "not S7 / EtherNet/IP" also matched a Windows server whose only
      # OT protocol was an OPC UA discovery service (Arcon test, 2026-11-12).
      - { name: Modbus only (not an S7 or EtherNet/IP controller), field: ot.protocols, condition: "contains 'modbus' and not intersects ['s7', 'enip']", weight: 140 }
